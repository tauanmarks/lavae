# Publica no Instagram o post cujo pull request foi aprovado (merge na main).
# O merge É a aprovação. Também dá para publicar um ciclo à mão: Actions → "Publicar no Instagram" → Run workflow.
# Posts com "agendar_para" (posts automáticos de terça e sexta, 11h) saem pelo agendamento abaixo.
# Disparo principal das 11h: a rotina "Lavaê – gatilho 11h" do Claude (nuvem) faz push em
# automacao-instagram/gatilhos/posts.txt às ~10h55 de terça e sexta. O agendamento do GitHub atrasa horas ou pula:
# fica só de reserva. Já publicado não sai de novo.
name: Publicar no Instagram

on:
  schedule:
    - cron: "40 13 * * *"   # 10h40 em São Luís (UTC-3): espera até a hora marcada
    - cron: "10 14 * * *"   # reserva 11h10
    - cron: "45 14 * * *"   # reserva 11h45
    - cron: "30 16 * * *"   # reserva 13h30
  push:
    branches: [main]
    paths: ["automacao-instagram/ciclos/**", "automacao-instagram/gatilhos/posts.txt"]
  workflow_dispatch:
    inputs:
      ciclo:
        description: "Nome do ciclo a publicar (pasta em automacao-instagram/ciclos)"
        required: true

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[publicado]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # no agendamento, a main de agora (com o registro de uma execução anterior), não a do disparo
          ref: ${{ (github.event_name == 'schedule' || contains(github.event.head_commit.message, '[gatilho]')) && 'main' || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pillow numpy

      - name: Publicar ciclos aprovados
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSAO: ${{ vars.IG_API_VERSAO }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_BASE_URL: ${{ vars.IG_BASE_URL }}
          APROVADO_POR: ${{ github.actor }} (merge no GitHub)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ contains(github.event.head_commit.message, '[gatilho]') }}" = "true" ]; then
            python automacao-instagram/ci_publicar.py --agendados
          elif [ -n "${{ github.event.inputs.ciclo }}" ]; then
            python automacao-instagram/ci_publicar.py --ciclo "${{ github.event.inputs.ciclo }}"
          else
            python automacao-instagram/ci_publicar.py --antes "${{ github.event.before }}" --depois "${{ github.sha }}"
          fi

      - name: Guardar registro da publicação
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # um "git add" por padrão: se um deles não existir (ex.: falhou antes de publicar), o outro ainda entra
          for f in automacao-instagram/ciclos/*/aprovacao.json automacao-instagram/ciclos/*/publicacao.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Registro de aprovação/publicação [publicado]"
            # a main pode ter andado durante a publicação (outra execução, um merge): junta e tenta de novo.
            # -X theirs: no conflito de registro, vale o desta execução (que acabou de publicar).
            for tentativa in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((tentativa * 5))
            done
            echo "::error::Não consegui gravar o registro. Publicado mesmo assim: copie a linha PUBLICADO do passo anterior."
            exit 1
          fi
