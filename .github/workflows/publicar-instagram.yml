# Publica no Instagram o post cujo pull request foi aprovado (merge na main).
# O merge É a aprovação. Também dá para publicar um ciclo à mão: Actions → "Publicar no Instagram" → Run workflow.
name: Publicar no Instagram

on:
  push:
    branches: [main]
    paths: ["automacao-instagram/ciclos/**"]
  workflow_dispatch:
    inputs:
      ciclo:
        description: "Nome do ciclo a publicar (pasta em automacao-instagram/ciclos)"
        required: true

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[publicado]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pillow

      - name: Publicar ciclos aprovados
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSAO: ${{ vars.IG_API_VERSAO }}
          IG_BASE_URL: ${{ vars.IG_BASE_URL }}
          APROVADO_POR: ${{ github.actor }} (merge no GitHub)
        run: |
          if [ -n "${{ github.event.inputs.ciclo }}" ]; then
            python automacao-instagram/ci_publicar.py --ciclo "${{ github.event.inputs.ciclo }}"
          else
            python automacao-instagram/ci_publicar.py --antes "${{ github.event.before }}" --depois "${{ github.sha }}"
          fi

      - name: Guardar registro da publicação
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automacao-instagram/ciclos/*/aprovacao.json automacao-instagram/ciclos/*/publicacao.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Registro de aprovação/publicação [publicado]"
            git push
          fi
